# Aptabase self-host for LocalRouter telemetry (deploy under Dokploy project "raven").
# Secrets come from env (set them in Dokploy's Environment panel, NOT here).
# After it's up: open BASE_URL, register, create app "LocalRouter" -> copy the A-SH-… key.
# No SMTP -> the login magic-link is printed to the aptabase container logs.
services:
  aptabase_db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: aptabase
      POSTGRES_PASSWORD: ${APTABASE_PG_PW}
      POSTGRES_DB: aptabase
    volumes:
      - db-data:/var/lib/postgresql/data

  aptabase_events_db:
    image: clickhouse/clickhouse-server
    restart: always
    environment:
      CLICKHOUSE_USER: aptabase
      CLICKHOUSE_PASSWORD: ${APTABASE_CH_PW}
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - events-db-data:/var/lib/clickhouse

  aptabase:
    image: ghcr.io/aptabase/aptabase:main
    restart: always
    depends_on: [aptabase_db, aptabase_events_db]
    ports:
      - "8000:8080"   # Dokploy: point the domain at container port 8080
    environment:
      BASE_URL: ${APTABASE_BASE_URL}
      AUTH_SECRET: ${APTABASE_AUTH_SECRET}
      DATABASE_URL: "Server=aptabase_db;Port=5432;User Id=aptabase;Password=${APTABASE_PG_PW};Database=aptabase"
      CLICKHOUSE_URL: "Host=aptabase_events_db;Port=9000;Username=aptabase;Password=${APTABASE_CH_PW};"

volumes:
  db-data:
  events-db-data:
