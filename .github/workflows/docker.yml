# Build + publish the LocalRouter container to GHCR on every version tag.
# Image: ghcr.io/ravencloak-org/localrouter:<version> (+ :latest). Public, no auth to pull.
name: Docker
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: LR_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/ravencloak-org/localrouter:${{ steps.v.outputs.version }}
            ghcr.io/ravencloak-org/localrouter:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
