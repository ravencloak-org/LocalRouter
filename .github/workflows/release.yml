name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-core:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: arm64
            runner: ubuntu-latest
            bun-target: bun-darwin-arm64
            ext: ""
          - os: darwin
            arch: x64
            runner: ubuntu-latest
            bun-target: bun-darwin-x64
            ext: ""
          - os: linux
            arch: x64
            runner: ubuntu-latest
            bun-target: bun-linux-x64
            ext: ""
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            bun-target: bun-linux-arm64
            ext: ""
          - os: windows
            arch: x64
            runner: ubuntu-latest
            bun-target: bun-windows-x64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Build core binary
        run: |
          cd core
          bun install
          bun build server.ts --compile --target=${{ matrix.bun-target }} --outfile ../dist/localrouter-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: localrouter-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/localrouter-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}

  build-mac-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Mac tray app
        run: |
          cd tray
          ./build-app.sh
      - name: Zip app
        run: |
          cd tray
          zip -r ../LocalRouter-macos.zip LocalRouter.app
      - uses: actions/upload-artifact@v4
        with:
          name: LocalRouter-macos
          path: LocalRouter-macos.zip

  release:
    needs: [build-core, build-mac-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
