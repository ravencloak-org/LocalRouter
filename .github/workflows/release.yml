name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-core:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: arm64
            runner: ubuntu-latest
            bun-target: bun-darwin-arm64
            ext: ""
          - os: darwin
            arch: x64
            runner: ubuntu-latest
            bun-target: bun-darwin-x64
            ext: ""
          - os: linux
            arch: x64
            runner: ubuntu-latest
            bun-target: bun-linux-x64
            ext: ""
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            bun-target: bun-linux-arm64
            ext: ""
          - os: windows
            arch: x64
            runner: ubuntu-latest
            bun-target: bun-windows-x64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Build core binary
        run: |
          cd core
          bun install
          VER="${GITHUB_REF_NAME#v}"
          bun build server.ts --compile --target=${{ matrix.bun-target }} --define "process.env.LR_VERSION=\"$VER\"" --outfile ../dist/localrouter-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: localrouter-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/localrouter-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}

  build-mac-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2 # build-app.sh compiles localrouter-core + dashboard with bun; without this they silently skip and the .app ships coreless
      - name: Build Mac tray app
        run: |
          cd tray
          LR_VERSION="${GITHUB_REF_NAME#v}" ./build-app.sh
      - name: Zip app
        run: |
          cd tray
          zip -r ../LocalRouter-macos.zip LocalRouter.app
      - uses: actions/upload-artifact@v4
        with:
          name: LocalRouter-macos
          path: LocalRouter-macos.zip

  # Windows/Linux tray bundles: tray + core + dashboard in one zip, consumed by the
  # in-app self-updater. Zip name uses GOOS/GOARCH tokens (updater.go bundleAsset()).
  build-tray:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            bun-target: bun-linux-x64
            ext: ""
          - os: linux
            arch: arm64
            bun-target: bun-linux-arm64
            ext: ""
          - os: windows
            arch: amd64
            bun-target: bun-windows-x64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: tray-go/go.mod
      - name: Build bundle
        run: |
          VER="${GITHUB_REF_NAME#v}"
          STAGE="$PWD/stage"
          mkdir -p "$STAGE/web"
          ( cd web && bun install && bun run build )
          cp -R web/dist "$STAGE/web/dist"
          ( cd core && bun install && bun build server.ts --compile --target=${{ matrix.bun-target }} --define "process.env.LR_VERSION=\"$VER\"" --outfile "$STAGE/localrouter-core${{ matrix.ext }}" )
          ( cd tray-go && GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -ldflags "-X main.version=$VER" -o "$STAGE/localrouter-tray${{ matrix.ext }}" . )
          ( cd "$STAGE" && zip -r "$PWD/../LocalRouter-${{ matrix.os }}-${{ matrix.arch }}.zip" . )
      - uses: actions/upload-artifact@v4
        with:
          name: LocalRouter-${{ matrix.os }}-${{ matrix.arch }}
          path: LocalRouter-${{ matrix.os }}-${{ matrix.arch }}.zip

  release:
    needs: [build-core, build-mac-app, build-tray]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git-cliff needs full history + tags to build the changelog
      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header # only this tag's commits, grouped
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Stamp version + checksums into packaging
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/release-fill.sh "$VERSION" artifacts
          ( cd artifacts && shasum -a 256 localrouter-* LocalRouter-*.zip > checksums.txt )
          # ship the filled packaging files as release assets (tap + flake consumers grab these)
          cp flake.nix artifacts/flake.nix
          cp packaging/homebrew/Formula/localrouter.rb artifacts/formula-localrouter.rb
          cp packaging/homebrew/Casks/localrouter.rb   artifacts/cask-localrouter.rb
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: ${{ steps.changelog.outputs.content }} # full changelog into the release description
